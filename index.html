<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ma Petite Ferme — La vallée de Bourg-Joli</title>
<style>
  :root { --wood: #8b5a2b; --woodD: #5c3a1a; --woodDD: #3e250f; --paper: #fff8ea; --paper2: #f3e6cc; --ink: #3b2f1e; --green: #43a047; --gold: #f9a825; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e3a1a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  canvas#game { display: block; width: 100vw; height: 100vh; touch-action: none; image-rendering: pixelated; }
  img { image-rendering: pixelated; }
  .ico { width: 20px; height: 20px; vertical-align: -5px; }

  /* ---------- HUD ---------- */
  #hudL { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
  .pcard { display: flex; gap: 10px; align-items: center; background: linear-gradient(var(--paper), var(--paper2)); border: 3px solid var(--wood); border-radius: 14px; padding: 6px 12px 6px 6px; box-shadow: 0 4px 0 var(--woodD); cursor: pointer; }
  .pcard .pp { width: 52px; height: 52px; background: #bfe3f5; border-radius: 10px; border: 2px solid var(--woodD); }
  .pinfo { display: flex; flex-direction: column; min-width: 170px; }
  .pinfo b { font-size: 15px; } .pinfo small { font-size: 11px; opacity: .75; }
  .lvl { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .badge { background: var(--gold); color: #fff; font-weight: 800; font-size: 11px; padding: 2px 7px; border-radius: 99px; box-shadow: 0 2px 0 #c17900; }
  .xpbar { flex: 1; height: 8px; background: #e2d3b4; border-radius: 9px; overflow: hidden; border: 1px solid #c9b48c; }
  .xpbar > div { height: 100%; background: linear-gradient(#ffe27a, #f9b825); transition: width .3s; }
  .chips { display: flex; gap: 6px; }
  .chip { background: rgba(62,37,15,.9); color: #fff8e7; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #quest { position: fixed; top: 130px; left: 10px; z-index: 10; width: 270px; display: flex; flex-direction: column; gap: 6px; }
  .q { background: rgba(255,248,234,.96); border: 2px solid #d8c09a; border-radius: 12px; padding: 8px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.18); font-size: 13px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .q b { color: var(--woodD); font-size: 14px; } .q small { opacity: .75; font-size: 11px; }
  .qh { display: flex; gap: 8px; align-items: center; } .qh img { width: 34px; height: 34px; background: #bfe3f5; border-radius: 8px; border: 2px solid var(--wood); } .qh div { display: flex; flex-direction: column; }
  .qbar { height: 7px; background: #e8dcc4; border-radius: 9px; overflow: hidden; }
  .qbar > div { height: 100%; background: var(--green); transition: width .3s; }
  .q.mini { flex-direction: row; justify-content: space-between; font-weight: 700; }

  #hudR { position: fixed; top: 10px; right: 10px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .mapframe { background: var(--wood); padding: 5px; border-radius: 12px; box-shadow: 0 4px 0 var(--woodD); }
  #mini { display: block; width: 200px; height: 150px; border-radius: 7px; cursor: pointer; background: #1e3a1a; }
  #hudInfo { background: linear-gradient(var(--paper), var(--paper2)); border: 3px solid var(--wood); border-radius: 12px; padding: 5px 10px; text-align: right; box-shadow: 0 3px 0 var(--woodD); width: 210px; }
  #hudInfo .zone { font-weight: 800; font-size: 13px; color: var(--woodD); } #hudInfo .time { font-size: 13px; font-weight: 600; }
  .btnrow { display: flex; gap: 5px; }
  .hbtn { border: none; background: rgba(62,37,15,.9); color: #fff8e7; font-size: 16px; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .hbtn:hover { background: var(--wood); }

  #prompt { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(255,248,234,.97); padding: 7px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; box-shadow: 0 4px 0 rgba(0,0,0,.2); z-index: 10; white-space: nowrap; border: 2px solid #d8c09a; }
  #prompt:empty { display: none; }
  #prompt .ico { width: 22px; height: 22px; }
  kbd { background: var(--woodD); color: #fff; border-radius: 6px; padding: 1px 7px; margin-right: 6px; font-family: inherit; box-shadow: 0 2px 0 var(--woodDD); }

  #hotbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; background: var(--wood); padding: 6px; border-radius: 14px; box-shadow: 0 4px 0 var(--woodD); }
  .slot { width: 58px; height: 66px; background: var(--paper); border: 3px solid transparent; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; }
  .slot .i { font-size: 24px; line-height: 1; }
  .slot img.si { width: 34px; height: 34px; }
  .slot .p { font-size: 10px; font-weight: 700; margin-top: 2px; }
  .slot .k { position: absolute; top: 1px; left: 4px; font-size: 10px; opacity: .6; font-weight: 700; }
  .slot.sel { border-color: #ffd54f; background: #fff3c4; transform: translateY(-5px); box-shadow: 0 5px 0 #c9a23a; }
  .slot.locked { opacity: .5; }
  .slot.can { cursor: default; margin-left: 6px; flex-direction: row; gap: 4px; background: #e3f2fd; }
  .gauge { width: 9px; height: 46px; background: #b3c7d6; border-radius: 5px; display: flex; align-items: flex-end; overflow: hidden; }
  .gauge > div { width: 100%; background: linear-gradient(#7cc4f5, #2f80c8); }

  #toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 40; align-items: center; pointer-events: none; }
  .toast { background: rgba(62,37,15,.95); color: #fff8e7; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; animation: tin .25s ease-out; }
  .toast.gold { background: linear-gradient(#f9b825, #e08e00); color: #3e250f; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
  #banner { position: fixed; top: 18%; left: 50%; transform: translate(-50%, -10px); text-align: center; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .5s, transform .5s; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner small { display: block; color: #fff8e7; font-weight: 700; font-size: 15px; text-shadow: 0 2px 4px #000; letter-spacing: 1px; }
  #banner b { display: block; color: #fff; font-size: 38px; font-weight: 900; text-shadow: 0 3px 0 var(--woodD), 0 6px 14px rgba(0,0,0,.5); }

  /* ---------- Dialogue ---------- */
  #dialog { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); width: min(720px, 94vw); z-index: 25; display: flex; gap: 14px; background: linear-gradient(var(--paper), var(--paper2)); border: 4px solid var(--wood); border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 0 var(--woodD), 0 10px 30px rgba(0,0,0,.4); cursor: pointer; }
  #dialog[hidden] { display: none; }
  #dport { width: 96px; height: 96px; background: #bfe3f5; border-radius: 12px; border: 3px solid var(--woodD); flex: none; }
  #dbody { flex: 1; display: flex; flex-direction: column; }
  #dname { font-weight: 900; font-size: 17px; color: var(--woodD); } #dname small { font-weight: 600; opacity: .7; font-size: 12px; }
  #dtext { font-size: 15px; line-height: 1.45; margin: 6px 0; white-space: pre-line; min-height: 66px; }
  #dnext { align-self: flex-end; background: var(--green); color: #fff; font-weight: 800; border-radius: 9px; padding: 4px 12px; font-size: 13px; box-shadow: 0 3px 0 #2e7d32; }

  /* ---------- Panneaux ---------- */
  #panel { position: fixed; inset: 0; background: rgba(20,12,4,.5); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 12px; }
  #panel[hidden] { display: none; }
  .box { background: var(--paper); border: 4px solid var(--wood); border-radius: 18px; width: min(820px, 100%); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 8px 0 var(--woodDD); }
  .ph { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: linear-gradient(var(--wood), #7a4d22); color: #fff8e7; border-radius: 12px 12px 0 0; }
  .ph h2 { margin: 0; font-size: 20px; text-shadow: 0 2px 0 var(--woodDD); }
  .ph button { background: rgba(0,0,0,.2); border: none; color: #fff8e7; font-size: 18px; cursor: pointer; width: 34px; height: 34px; border-radius: 9px; }
  #pbody { padding: 14px 16px 18px; overflow-y: auto; }
  #pbody h3 { margin: 16px 0 8px; color: var(--woodD); font-size: 16px; } #pbody h3:first-child { margin-top: 0; }
  #pbody h3.lockh { opacity: .5; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; border-bottom: 2px solid #e6d5b5; padding-bottom: 8px; }
  .tab { border: none; background: #efe3cf; color: var(--woodD); font-weight: 700; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-family: inherit; font-size: 13px; }
  .tab.on { background: var(--wood); color: #fff; box-shadow: 0 3px 0 var(--woodD); }
  [data-act] { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  [data-act] * { pointer-events: none; }
  input[data-act] { pointer-events: auto; }
  .btn { border: none; background: var(--green); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 12px; border-radius: 10px; box-shadow: 0 3px 0 #2e7d32; cursor: pointer; font-family: inherit; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #2e7d32; }
  .btn.gold { background: var(--gold); box-shadow: 0 3px 0 #c17900; }
  .btn.red { background: #e53935; box-shadow: 0 3px 0 #b71c1c; }
  .btn.ghost { background: #efe3cf; color: var(--woodD); box-shadow: 0 3px 0 #d8c09a; }
  .btn.big { font-size: 18px; padding: 12px 20px; width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; } .row.end { justify-content: flex-end; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { background: #fff; border: 2px solid #e0cfae; border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 0 #e8dcc4; }
  .card h4 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .card h4 img.big { height: 30px; }
  .card p { margin: 4px 0; font-size: 13px; }
  .card.locked { opacity: .55; }
  .recipe { border-top: 1px dashed #e0cfae; padding-top: 7px; margin-top: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .pbar { height: 7px; background: #e8dcc4; border-radius: 9px; overflow: hidden; margin-top: 6px; } .pbar > div { height: 100%; background: var(--gold); }
  .ok { color: #2e7d32; font-weight: 700; } .ko { color: #c62828; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  td { padding: 6px 8px; border-bottom: 1px solid #f0e3c8; font-size: 14px; } td.n { text-align: right; white-space: nowrap; }
  .muted { opacity: .7; font-size: 13px; }
  .mrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; margin-bottom: 4px; background: #fff; border: 1px solid #efe3cf; }
  .mrow.cur { border: 2px solid var(--gold); background: #fffaeb; } .mrow.done { opacity: .6; } .mrow.lock { opacity: .4; }
  .mrow .r { text-align: right; min-width: 120px; } .mrow .qbar { width: 120px; display: inline-block; }
  .talkbox { display: flex; gap: 12px; background: #fff; border: 2px solid #e0cfae; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  .talkbox img { width: 64px; height: 64px; background: #bfe3f5; border-radius: 10px; border: 2px solid var(--wood); }
  .talkbox p { margin: 4px 0 0; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .cell { background: #fff; border: 2px solid #e0cfae; border-radius: 10px; padding: 6px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .cell img { width: 40px; height: 40px; } .cell .q { position: absolute; top: 3px; right: 6px; font-weight: 800; font-size: 13px; color: var(--woodD); }
  .cell small { font-size: 11px; text-align: center; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: #fff; border: 2px solid #efe3cf; border-radius: 10px; padding: 8px; text-align: center; display: flex; flex-direction: column; }
  .stats b { font-size: 18px; } .stats small { font-size: 11px; opacity: .7; }
  #bigmap { width: 100%; height: auto; border-radius: 10px; border: 3px solid var(--wood); image-rendering: pixelated; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 700; } .legend span { background: #fff; padding: 4px 8px; border-radius: 8px; } .legend .off { opacity: .55; }
  .reqs { font-size: 16px; }
  .chip.buff { background: rgba(46,125,50,.92); font-size: 12px; padding: 4px 9px; }
  .jw { width: 26px; height: 26px; background: rgba(255,248,234,.9); border-radius: 8px; border: 2px solid var(--gold); }
  .slot.glabel { cursor: default; background: #e8f5e9; }
  .consos { display: flex; gap: 4px; margin-left: 8px; align-items: center; }
  .cslot { width: 40px; height: 48px; background: var(--paper); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .cslot img { width: 26px; height: 26px; } .cslot b { font-size: 11px; } .cslot.empty { opacity: .45; } .cslot:hover { background: #fff3c4; }
  .cell .btn { margin-top: 4px; }
  .cosgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cos { background: #fff; border: 2px solid #e0cfae; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .cos.on { border-color: var(--green); background: #f1f8e9; } .cos.notown { opacity: .85; } .cos small { font-size: 11px; opacity: .8; }
  .achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .ach { display: flex; gap: 10px; background: #fff; border: 2px solid #e0cfae; border-radius: 10px; padding: 8px; }
  .ach.done { border-color: var(--gold); background: #fffaeb; } .ach .medal { font-size: 26px; } .ach small { display: block; font-size: 11px; opacity: .8; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pb { border: 2px solid #e0cfae; background: #fff; border-radius: 10px; padding: 4px 6px; display: flex; flex-direction: column; align-items: center; min-width: 70px; cursor: pointer; font-family: inherit; font-size: 20px; }
  .pb img { width: 32px; height: 32px; } .pb small { font-size: 11px; font-weight: 700; }
  .pb.on { border-color: var(--gold); background: #fff3c4; box-shadow: 0 0 0 3px #ffe08a; } .pb:disabled { opacity: .45; }
  .fieldgrid { background: #7a5434; border: 4px solid var(--wood); border-radius: 12px; padding: 8px; display: inline-flex; flex-direction: column; gap: 4px; user-select: none; }
  .fhead { color: #f3e6cc; font-size: 11px; font-weight: 700; text-align: center; }
  .prow { display: flex; gap: 4px; align-items: center; }
  .pc { width: 62px; height: 62px; background: #8a5d3b; border: 2px solid #6e4520; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; touch-action: none; }
  .pc:hover { border-color: #ffd54f; } .pc.has { background: #9a6a42; }
  .pc > img { width: 34px; height: 34px; } .pc .none { color: #c9a77a; font-weight: 800; }
  .pc img.now { position: absolute; bottom: 2px; left: 3px; width: 18px; height: 18px; } .pc small { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: #fff; font-weight: 700; text-shadow: 0 1px 1px #000; }
  .pc.lock { background: #5a7a3a; border-color: #46602c; cursor: not-allowed; opacity: .6; font-size: 20px; }
  .btn.sm { padding: 5px 8px; font-size: 12px; }
  .sellq { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
  .qty { width: 64px; padding: 5px 6px; border-radius: 8px; border: 2px solid #d8c09a; font-family: inherit; font-size: 14px; }
  .planinfo { background: #fff; border: 2px solid #e0cfae; border-radius: 10px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 760px) { .pc { width: 38px; height: 38px; } .pc > img { width: 22px; height: 22px; } .pc img.now, .pc small { display: none; } }
  .chipL { background: #fff; border: 2px solid #e0cfae; border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .help li { margin: 6px 0; }
  label { font-weight: 700; display: flex; gap: 6px; align-items: center; }

  /* ---------- Écran titre ---------- */
  #title { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(30,58,26,.35), rgba(15,25,12,.85)); }
  #title[hidden] { display: none; }
  .tbox { background: linear-gradient(var(--paper), var(--paper2)); border: 5px solid var(--wood); border-radius: 22px; padding: 26px 30px; width: min(440px, 92vw); box-shadow: 0 10px 0 var(--woodDD), 0 20px 50px rgba(0,0,0,.5); text-align: center; }
  .tbox h1 { margin: 0; font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--woodD), 0 0 0 #000; -webkit-text-stroke: 1.5px var(--woodD); }
  .tbox .vtitle { margin: 2px 0 14px; font-weight: 800; color: var(--green); letter-spacing: 1px; }
  .tbox .sub { margin: 0 0 14px; }
  .tbox label { flex-direction: column; align-items: stretch; text-align: left; margin-bottom: 10px; font-size: 13px; }
  .tbox input { margin-top: 4px; padding: 10px 12px; font-size: 16px; border-radius: 10px; border: 2px solid #d8c09a; font-family: inherit; background: #fff; }
  .tbox .btn { margin-top: 8px; }
  .savecard { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid #e0cfae; border-radius: 12px; padding: 10px; margin-bottom: 8px; text-align: left; }
  .savecard img { width: 56px; height: 56px; background: #bfe3f5; border-radius: 10px; } .savecard div { display: flex; flex-direction: column; } .savecard small { opacity: .75; }

  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #joy { position: fixed; left: 18px; bottom: 100px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.35); z-index: 12; touch-action: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,248,231,.85); }
    #abtn { position: fixed; right: 22px; bottom: 120px; width: 84px; height: 84px; border-radius: 50%; border: none; background: var(--gold); color: #fff; font-size: 26px; font-weight: 800; box-shadow: 0 5px 0 #c17900; z-index: 12; }
    #prompt { bottom: 236px; font-size: 13px; }
  }
  @media (max-width: 760px) {
    #quest { width: 210px; top: 120px; } .pinfo { min-width: 120px; } #mini { width: 140px; height: 105px; } #hudInfo { width: 150px; }
    .slot { width: 44px; height: 54px; } .slot img.si { width: 26px; height: 26px; }
    #dport { width: 64px; height: 64px; } #banner b { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hudL"></div>
<div id="quest"></div>
<div id="hudR">
  <div class="mapframe" title="Carte (C)"><canvas id="mini" width="200" height="150"></canvas></div>
  <div id="hudInfo"></div>
  <div class="btnrow">
    <button class="hbtn" data-act="zoomOut" title="Dézoomer (molette)">➖</button>
    <button class="hbtn" data-act="zoomIn" title="Zoomer (molette)">➕</button>
    <button class="hbtn" data-act="open" data-k="journal" title="Journal (J)">📜</button>
    <button class="hbtn" data-act="open" data-k="plan" title="Plan du champ (F)">🌾</button>
    <button class="hbtn" data-act="open" data-k="machines" title="Machines (M)">🔧</button>
    <button class="hbtn" data-act="open" data-k="staff" title="Employés (P)">👷</button>
    <button class="hbtn" data-act="open" data-k="livre" title="Livre des objectifs (L)">📖</button>
    <button class="hbtn" data-act="open" data-k="perso" title="Personnage et bijoux (K)">🧍</button>
    <button class="hbtn" data-act="open" data-k="bag" title="Sac (I)">🎒</button>
    <button class="hbtn" data-act="open" data-k="map" title="Carte (C)">🗺️</button>
    <button class="hbtn" data-act="open" data-k="options" title="Options (O)">⚙️</button>
    <button class="hbtn" data-act="open" data-k="help" title="Aide (H)">❓</button>
  </div>
</div>
<div id="prompt"></div>
<div id="hotbar"></div>
<div id="toasts"></div>
<div id="banner"></div>

<script>
// ============================================================
//  PIXEL ART — tout est dessiné ici, pixel par pixel, en code.
//  1 « pixel art » = 3 pixels écran au zoom 1. Une case = 16×16.
// ============================================================
const OUTLINE = '#2a1d14';
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };

function pixApi(g, ox = 0, oy = 0) {
  const A = {
    g,
    p(x, y, c) { g.fillStyle = c; g.fillRect(ox + Math.round(x), oy + Math.round(y), 1, 1); },
    r(x, y, w, h, c) { if (w <= 0 || h <= 0) return; g.fillStyle = c; g.fillRect(ox + Math.round(x), oy + Math.round(y), Math.round(w), Math.round(h)); },
    e(cx, cy, rx, ry, c) {
      g.fillStyle = c;
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) g.fillRect(ox + x, oy + y, 1, 1);
      }
    },
    // ellipse ombrée : sombre en bas à droite, clair en haut à gauche
    es(cx, cy, rx, ry, base, dark, light) {
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry, d = dx * dx + dy * dy;
        if (d > 1) continue;
        let c = base;
        if (dark && (dx * .5 + dy) > .45 && d > .35) c = dark;
        if (light && (dx + dy) < -.75 && d < .75) c = light;
        g.fillStyle = c; g.fillRect(ox + x, oy + y, 1, 1);
      }
    },
    line(x0, y0, x1, y1, c) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
      g.fillStyle = c;
      for (;;) { g.fillRect(ox + x0, oy + y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    },
  };
  return A;
}
function addOutline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data;
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 60;
  g.fillStyle = col;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (!op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) g.fillRect(x, y, 1, 1);
}
function mk(w, h, fn, outline = OUTLINE) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(pixApi(c.getContext('2d')));
  if (outline) addOutline(c, outline);
  return c;
}
function flipC(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
function toURL(src, scale = 3) {
  const c = document.createElement('canvas'); c.width = src.width * scale; c.height = src.height * scale;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, c.width, c.height); return c.toDataURL();
}

// ---------- Couleurs ----------
const C = {
  g: '#4caf50', gd: '#2e7d32', gl: '#7bd06b',
  grass: '#5fa843', grassL: '#69b44b', grassD: '#56993c', grassT: '#4a8a35',
  path: '#c9a066', pathD: '#b8915a', pathL: '#d8b47c',
  sand: '#e6cf8f', sandD: '#d4b977', sandL: '#f0dca6',
  water: '#3d8fd6', waterL: '#4a9ce0', waterD: '#3382c8', foam: '#d8f1ff', foam2: '#8cc8f0',
  wood: '#9a6434', woodD: '#7a4a24', woodL: '#b97d45',
};

// ============================================================
//  ANIMAUX — regardent à gauche, 2 images (on les retourne pour la droite)
// ============================================================
function chickenSprite(f) {
  return mk(16, 15, P => {
    const w = '#fbfbf8', wd = '#dcdcd4';
    P.e(9, 8, 4.8, 3.8, w); P.e(10, 10, 3.6, 1.6, wd);
    P.r(12, 3, 2, 5, w); P.p(14, 3, w); P.p(14, 4, wd); P.p(13, 7, wd);
    P.e(5, 5, 2.6, 2.6, w);
    P.r(4, 1, 3, 1, '#e53935'); P.p(5, 0, '#e53935'); P.p(3, 2, '#e53935');
    P.r(1, 5, 2, 1, '#f5b02e'); P.p(2, 6, '#d99020');
    P.p(4, 4, '#222'); P.p(4, 7, '#e53935');
    P.r(8, 7, 4, 2, wd); P.p(11, 9, wd);
    if (f) { P.r(7, 12, 1, 2, '#f5a623'); P.r(10, 11, 1, 2, '#f5a623'); P.p(11, 13, '#f5a623'); }
    else { P.r(7, 12, 1, 2, '#f5a623'); P.r(10, 12, 1, 2, '#f5a623'); P.p(6, 13, '#f5a623'); P.p(9, 13, '#f5a623'); }
  });
}
function cowSprite(f) {
  return mk(27, 21, P => {
    const w = '#fafafa', wd = '#e0ddd6', k = '#2b2b2b';
    const legs = f ? [[8, -1], [11, 0], [18, 0], [21, -1]] : [[8, 0], [11, -1], [18, -1], [21, 0]];
    legs.forEach(([x, d]) => { P.r(x, 15 + d, 2, 4, wd); P.r(x, 19 + d, 2, 1, '#4a3a2a'); });
    P.es(15, 10, 10, 5.6, w, wd, null);
    P.e(12, 8, 3, 2.2, k); P.e(19.5, 12, 2.6, 2, k); P.e(18, 6, 2, 1.3, k);
    P.r(16, 15, 3, 2, '#f2a9b5');
    P.r(24, 6, 1, 6, w); P.r(24, 12, 2, 2, k);
    P.r(2, 5, 7, 7, w); P.r(5, 5, 3, 3, k); P.p(2, 5, '#00000000');
    P.r(1, 10, 6, 3, '#f2a9b5'); P.p(2, 11, '#b86a78'); P.p(4, 11, '#b86a78');
    P.p(4, 7, '#111'); P.p(3, 4, '#efe2c0'); P.p(2, 3, '#efe2c0'); P.p(7, 4, '#efe2c0'); P.p(8, 3, '#efe2c0');
    P.r(8, 6, 2, 1, wd);
  });
}
function sheepSprite(f) {
  return mk(23, 19, P => {
    const wool = '#f2ead9', woolD = '#d9ceb5', face = '#4a4a4a';
    const legs = f ? [[8, -1], [11, 0], [15, 0], [18, -1]] : [[8, 0], [11, -1], [15, -1], [18, 0]];
    legs.forEach(([x, d]) => P.r(x, 14 + d, 2, 4, face));
    [[9, 8], [13, 6.5], [17, 8], [11, 11], [15, 11], [19, 10.5], [7, 10.5]].forEach(([x, y]) => P.e(x, y, 3.8, 3.6, woolD));
    [[9, 7.5], [13, 6], [17, 7.5], [11, 10.5], [15, 10.5], [19, 10], [7, 10]].forEach(([x, y]) => P.e(x, y, 3.4, 3.2, wool));
    [[12, 4], [16, 6], [8, 6]].forEach(([x, y]) => P.p(x, y, '#fffdf6'));
    P.es(4, 9, 2.8, 3.4, face, '#333', '#5e5e5e');
    P.r(1, 7, 2, 1, face); P.r(6, 7, 2, 1, face);
    P.p(3, 9, '#fff'); P.e(5, 5.5, 2, 1.5, wool);
  });
}
function pigSprite(f) {
  return mk(23, 17, P => {
    const pk = '#f4a6b4', pd = '#de8798', pl = '#fbc7d0';
    const legs = f ? [[7, -1], [10, 0], [15, 0], [18, -1]] : [[7, 0], [10, -1], [15, -1], [18, 0]];
    legs.forEach(([x, d]) => { P.r(x, 12 + d, 2, 3, pd); P.p(x, 15 + d, '#b55a6c'); P.p(x + 1, 15 + d, '#b55a6c'); });
    P.es(12, 8, 8.6, 5, pk, pd, pl);
    P.e(5, 8, 4, 4, pk);
    P.r(0, 8, 3, 3, '#e8869a'); P.p(0, 9, '#9b4458'); P.p(2, 9, '#9b4458');
    P.r(5, 3, 2, 2, pd); P.p(4, 4, pd);
    P.p(4, 7, '#222'); P.p(3, 7, '#fff');
    P.p(21, 6, pd); P.p(22, 5, pd); P.p(21, 4, pd); P.p(20, 5, pd);
  });
}
function butterflySprite(col, f) {
  return mk(5, 4, P => {
    if (f) { P.r(0, 0, 2, 2, col); P.r(3, 0, 2, 2, col); P.r(0, 2, 2, 1, '#fff'); P.r(3, 2, 2, 1, '#fff'); }
    else { P.r(1, 0, 1, 2, col); P.r(3, 0, 1, 2, col); }
    P.r(2, 0, 1, 3, '#333');
  }, null);
}

// ============================================================
//  CULTURES — 16×24, posées sur le bas de la case
// ============================================================
function drawPlant(P, k, ripe) {
  const G = C.g, GD = C.gd, GL = C.gl;
  switch (k) {
    case 'ble': {
      const st = ripe ? '#c9a23a' : '#6fbf4a', ear = ripe ? '#ecc75a' : '#8fd166', earD = ripe ? '#c79a2c' : '#5fa83e';
      const top = ripe ? 6 : 11;
      [3, 5, 8, 10, 12].forEach((x, i) => {
        const t = top + (i % 2) * 2;
        P.r(x, t + 4, 1, 23 - t - 4, st); P.r(x, t, 2, 5, ear); P.p(x + 1, t + 1, earD); P.p(x, t + 3, earD); P.p(x + 1, t - 1, ear);
      });
      P.r(4, 18, 2, 1, ripe ? '#a8c45a' : G); P.r(9, 17, 2, 1, ripe ? '#a8c45a' : GD); break;
    }
    case 'carotte': {
      const s = ripe ? 1 : .65;
      for (let i = -3; i <= 3; i++) {
        const tx = 8 + i * 1.6 * s, ty = 17 - (9 - Math.abs(i) * 1.3) * s;
        P.line(8, 17, tx, ty, i % 2 ? GD : G); P.r(tx - 1, ty - 1, 2, 2, GL);
      }
      if (ripe) { P.e(8, 19.5, 3.2, 2, '#e67e22'); P.r(6, 19, 5, 1, '#c0601a'); P.p(7, 21, '#c0601a'); P.p(9, 18, '#f5a04a'); }
      break;
    }
    case 'tomate': {
      const fc = ripe ? '#e74c3c' : '#8bc34a';
      P.r(8, 5, 1, 18, '#9a6434'); P.p(8, 4, '#b97d45');
      P.e(6, 10, 3, 2, G); P.e(11, 13, 3, 2, GD); P.e(6, 16, 3, 2, G); P.e(10, 7, 2.5, 2, G); P.e(10, 19, 2.5, 1.6, GD);
      [[5, 12.5], [11, 9.5], [10, 17]].forEach(([x, y]) => { P.e(x, y, 2, 2, fc); P.p(x - 1, y - 1, ripe ? '#ffb3a7' : '#c5e1a5'); P.p(x, y - 2, GD); });
      break;
    }
    case 'mais': {
      const t = ripe ? 1 : 9;
      P.r(7, t, 2, 23 - t, '#5aa83a'); P.r(8, t, 1, 23 - t, '#4a9030');
      P.line(8, 16, 2, 11, G); P.line(8, 13, 14, 8, G); P.line(8, 19, 13, 16, GD); P.line(8, 21, 3, 18, GD);
      if (ripe) {
        P.r(6, 0, 1, 2, '#e8d07a'); P.r(9, 0, 1, 2, '#e8d07a'); P.p(8, 0, '#e8d07a');
        P.e(10.5, 9, 2, 4, '#f1c40f'); for (let y = 6; y < 13; y += 2) P.p(10, y, '#d4a50e'); P.p(11, 7, '#d4a50e'); P.p(11, 11, '#d4a50e');
        P.p(9, 12, GL); P.p(12, 12, GL); P.p(9, 13, G);
      } else { P.e(10, 14, 1.4, 2.5, GL); }
      break;
    }
    case 'fraise': {
      P.es(8, 19, 6.5, 3.8, G, GD, GL);
      if (ripe) [[3, 19], [8, 20], [11, 17]].forEach(([x, y]) => {
        P.r(x, y, 3, 3, '#e53950'); P.p(x + 1, y + 3, '#e53950'); P.p(x, y + 1, '#ffe082'); P.p(x + 2, y + 2, '#ffe082'); P.p(x + 1, y - 1, GD); P.p(x + 2, y, '#ff7a90');
      });
      else [[5, 17], [10, 18]].forEach(([x, y]) => { P.p(x, y - 1, '#fff'); P.p(x - 1, y, '#fff'); P.p(x + 1, y, '#fff'); P.p(x, y + 1, '#fff'); P.p(x, y, '#f2c94c'); });
      break;
    }
    case 'citrouille': {
      P.line(1, 22, 15, 20, GD); P.e(3, 19, 2.5, 2, G); P.e(13.5, 18, 2.5, 2, G); P.p(1, 19, GL);
      if (ripe) {
        P.es(8, 18.5, 6.2, 4.4, '#e67e22', '#c0601a', '#f5a04a');
        P.r(6, 15, 1, 7, '#c0601a'); P.r(10, 15, 1, 7, '#c0601a'); P.r(8, 12, 1, 3, '#6b4a1f'); P.p(9, 12, GD);
      } else P.es(8, 20, 3.6, 2.6, '#8bc34a', '#5d8f2f', '#b6e07a');
      break;
    }
    case 'cepe': {
      if (ripe) [[5, 19, 3.6], [11, 20, 3], [8, 15, 2.6]].forEach(([x, y, r]) => { P.r(x - 1, y - 1, 3, 4, '#f3e9d2'); P.r(x + 1, y - 1, 1, 4, '#d9cdb0'); P.e(x, y - 2, r, r * .65, '#8a5a2c'); P.p(x - 1, y - 3, '#b07a42'); });
      else [[6, 20, 2], [11, 21, 1.6]].forEach(([x, y, r]) => { P.r(x, y - 1, 1, 3, '#f3e9d2'); P.e(x, y - 2, r, r * .7, '#b07a42'); });
      P.p(3, 22, '#5a8a3a'); P.p(13, 22, '#5a8a3a'); break;
    }
    case 'myrtille': {
      P.es(8, 17, 6, 5, '#2f7d32', '#235e26', '#4c9a3f'); P.r(7, 21, 2, 2, '#5a3518');
      if (ripe) [[5, 15], [9, 13], [11, 17], [6, 19], [10, 20], [4, 17], [8, 17]].forEach(([x, y]) => { P.p(x, y, '#3242a8'); P.p(x + 1, y, '#4a5bd6'); P.p(x, y - 1, '#8a9cf0'); });
      else [[6, 15], [10, 16]].forEach(([x, y]) => P.p(x, y, '#ffffff'));
      break;
    }
    case 'melon': {
      P.line(1, 22, 15, 21, '#3f7a2e'); P.e(3, 19, 2.5, 1.8, C.g); P.e(13, 18.5, 2.5, 1.8, C.g);
      if (ripe) { P.es(8, 18.5, 5.5, 4.2, '#9bd36a', '#6fa84a', '#c6ec9a'); for (let x = 4; x < 13; x += 2) P.line(x, 15, x, 22, '#6fa84a'); P.r(8, 13, 1, 2, '#5a3518'); }
      else P.es(8, 20, 3, 2.4, '#7cb342', '#5d8f2f', '#a5d66a');
      break;
    }
    case 'vanille': {
      P.r(8, 4, 1, 19, '#9a6434'); P.line(8, 20, 3, 14, C.g); P.line(8, 16, 13, 10, C.g); P.line(8, 11, 4, 6, C.gd); P.e(4, 13, 2, 1.4, C.gl); P.e(12, 10, 2, 1.4, C.gl);
      if (ripe) { [[5, 15], [11, 12], [6, 8]].forEach(([x, y]) => { P.r(x, y, 1, 5, '#3a2a1a'); P.r(x + 1, y, 1, 5, '#5a3a1a'); }); P.e(10, 5, 1.6, 1.6, '#fff3b0'); }
      else P.e(10, 6, 1.6, 1.6, '#f4efe4');
      break;
    }
    case 'houx': {
      P.es(8, 17, 6.5, 5.5, '#1f6b2a', '#16521f', '#2e8a3a');
      [[3, 15], [12, 13], [9, 20], [5, 20]].forEach(([x, y]) => { P.p(x, y, '#0f3f16'); P.p(x + 1, y - 1, '#2e8a3a'); });
      if (ripe) [[6, 14], [10, 17], [7, 18], [12, 19], [5, 17]].forEach(([x, y]) => { P.p(x, y, '#e0244a'); P.p(x + 1, y, '#b01a38'); });
      P.r(2, 21, 12, 1, '#f2f6fa'); break;
    }
    case 'edelweiss': {
      P.r(8, 12, 1, 11, '#7f9a7a'); P.line(8, 19, 5, 16, '#9ab09a'); P.line(8, 17, 11, 14, '#9ab09a');
      if (ripe) { for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; P.e(8.5 + Math.cos(a) * 3, 9 + Math.sin(a) * 3, 1.6, 1.6, '#f8fbff'); } P.e(8.5, 9, 1.6, 1.6, '#f2c94c'); P.p(8, 8, '#d4a82c'); }
      else P.e(8.5, 11, 1.6, 1.6, '#dfe8f0');
      P.r(3, 22, 10, 1, '#f2f6fa'); break;
    }
    case 'tournesol': {
      P.r(8, 7, 1, 16, '#4f9a35'); P.e(5, 15, 3, 1.6, G); P.e(11.5, 12, 3, 1.6, G); P.e(5, 19, 2.5, 1.4, GD);
      if (ripe) {
        P.e(8.5, 5, 4.6, 4.6, '#f9c80e');
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; P.p(8.5 + Math.cos(a) * 5.3 - .5, 5 + Math.sin(a) * 5.3 - .5, '#f5b400'); }
        P.e(8.5, 5, 2.3, 2.3, '#6b3e1f'); P.p(8, 4, '#3e2410'); P.p(9, 5, '#3e2410'); P.p(7, 6, '#8a5530');
      } else { P.e(8.5, 7, 2, 2, GL); P.p(8, 6, '#c9e88a'); }
      break;
    }
  }
}
function cropSprite(k, stage) {
  if (stage === 0) return mk(16, 24, P => {
    P.e(8, 21, 4, 1.6, '#6e4a2c'); P.p(6, 21, '#e8d6a0'); P.p(9, 20, '#e8d6a0'); P.p(10, 22, '#e8d6a0');
  }, null);
  if (stage === 1) return mk(16, 24, P => {
    P.r(8, 17, 1, 5, C.g); P.r(5, 16, 3, 2, C.gl); P.r(9, 15, 3, 2, C.g); P.p(4, 15, C.gl); P.p(12, 14, C.g);
  });
  return mk(16, 24, P => drawPlant(P, k, stage === 3));
}

// ============================================================
//  OBJETS (icônes 16×16)
// ============================================================
const ICON_DRAW = {
  ble: P => { [[4, 15, 3, 3], [8, 15, 8, 2], [12, 15, 13, 3]].forEach(([x0, y0, x1, y1]) => { P.line(x0, y0, x1, y1 + 3, '#c9a23a'); P.r(x1 - 1, y1 - 1, 2, 5, '#ecc75a'); P.p(x1, y1 + 1, '#c79a2c'); }); P.r(5, 10, 7, 2, '#c0392b'); },
  carotte: P => { for (let y = 5; y <= 14; y++) { const h = Math.round((14 - y) * .32); P.r(8 - h, y, 2 * h + 1, 1, '#e67e22'); } P.p(7, 7, '#c0601a'); P.p(9, 9, '#c0601a'); P.p(7, 11, '#c0601a'); P.p(6, 6, '#f5a04a'); P.line(8, 4, 5, 1, C.g); P.line(8, 4, 8, 0, C.gd); P.line(8, 4, 11, 1, C.g); },

// ============================================================
//  SOL — dessiné case par case dans une grande image fixe
// ============================================================
function fringe(A, x, y, test, col, seed) {
  const R = rng(hash(x, y) + seed);
  const N = test(x, y - 1), S = test(x, y + 1), W = test(x - 1, y), E = test(x + 1, y);
  for (let i = 0; i < 16; i++) {
    const d = 1 + (R() < .45 ? 1 : 0) + (R() < .12 ? 1 : 0);
    if (N) A.r(i, 0, 1, d, col); if (S) A.r(i, 16 - d, 1, d, col);
    if (W) A.r(0, i, d, 1, col); if (E) A.r(16 - d, i, d, 1, col);
  }
  if (N && W) A.r(0, 0, 3, 3, col); if (N && E) A.r(13, 0, 3, 3, col);
  if (S && W) A.r(0, 13, 3, 3, col); if (S && E) A.r(13, 13, 3, 3, col);
}
function grassTile(A, x, y) {
  const R = rng(hash(x, y));
  A.r(0, 0, 16, 16, C.grass);
  for (let i = 0; i < 10; i++) A.p(R() * 16 | 0, R() * 16 | 0, C.grassL);
  for (let i = 0; i < 8; i++) A.p(R() * 16 | 0, R() * 16 | 0, C.grassD);
  for (let i = 0; i < 2; i++) { const tx = 1 + (R() * 13 | 0), ty = 2 + (R() * 12 | 0); A.p(tx, ty, C.grassT); A.p(tx - 1, ty + 1, C.grassT); A.p(tx + 1, ty + 1, C.grassT); A.p(tx, ty - 1, '#74c457'); }
}
function flowerOverlay(A, x, y) {
  const R = rng(hash(x, y) + 7), cols = ['#ff6b8b', '#ffd93b', '#ffffff', '#b28dff', '#ff9f43'];
  for (let i = 0; i < 3; i++) {
    const fx = 2 + (R() * 11 | 0), fy = 2 + (R() * 11 | 0), c = cols[R() * cols.length | 0];
    A.p(fx, fy + 2, C.gd); A.p(fx, fy - 1, c); A.p(fx - 1, fy, c); A.p(fx + 1, fy, c); A.p(fx, fy + 1, c); A.p(fx, fy, '#f2a900');
  }
}

  });

}

function forestTile(A, x, y) {
  const R = rng(hash(x, y) + 21);
  A.r(0, 0, 16, 16, '#3f7f35');
  for (let i = 0; i < 10; i++) A.p(R() * 16 | 0, R() * 16 | 0, '#47893b');
  for (let i = 0; i < 9; i++) A.p(R() * 16 | 0, R() * 16 | 0, '#356e2d');
  for (let i = 0; i < 3; i++) { const lx = R() * 14 | 0, ly = R() * 14 | 0; A.r(lx, ly, 2, 1, ['#8a5a2c', '#a0703c', '#c0802a'][i]); }
}
function snowTile(A, x, y) {
  const R = rng(hash(x, y) + 31);
  A.r(0, 0, 16, 16, '#e9f1f7');
  for (let i = 0; i < 9; i++) A.p(R() * 16 | 0, R() * 16 | 0, '#d6e3ee');
  for (let i = 0; i < 5; i++) A.p(R() * 16 | 0, R() * 16 | 0, '#ffffff');
  if (R() < .3) { const sx = R() * 12 | 0, sy = R() * 12 | 0; A.r(sx, sy, 3, 2, '#9aa4ad'); A.p(sx, sy, '#c0c8cf'); }
}
function stoneTile(A, x, y) {
  A.r(0, 0, 16, 16, '#a8a29a');
  const R = rng(hash(x, y) + 41);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) {
    const ox = c * 8 + (r % 2 ? 4 : 0), oy = r * 4;
    const col = ['#bdb7ae', '#b3ada4', '#c6c0b7'][R() * 3 | 0];
    A.r((ox + 1) % 16, oy + 1, 6, 2, col); A.r((ox + 1) % 16, oy + 1, 6, 1, '#d2ccc3');
  }
}
function cliffTile(A, x, y) {
  const R = rng(hash(x, y) + 51);
  A.r(0, 0, 16, 16, '#7d7f86');
  for (let i = 0; i < 5; i++) { const cx = R() * 13 | 0, cy = R() * 13 | 0; A.r(cx, cy, 4, 3, '#8f9198'); A.r(cx, cy + 3, 4, 1, '#62646b'); A.p(cx, cy, '#a3a5ab'); }

function plankTile(A, vertical) {
  A.r(0, 0, 16, 16, '#9a6434');

    else { A.r(0, i * 4, 16, 1, '#6e4520'); A.r(0, i * 4 + 1, 16, 1, '#b97d45'); }

}

const map = [];
const NODES = [];          // ressources à récolter
const nodeGrid = [];       // index rapide
function buildMap() {
  for (let y = 0; y < MH; y++) { map.push(new Array(MW).fill(T.GRASS)); nodeGrid.push(new Array(MW).fill(null)); }
  const set = (x, y, t) => { if (x >= 0 && y >= 0 && x < MW && y < MH) map[y][x] = t; };
  const get = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH) ? map[y][x] : T.CLIFF;
  const rect = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, t); };

  // Montagne : neige (même type « sol », le biome donne l'apparence)
  // Falaises
  rect(61, 0, 62, MH - 1, T.CLIFF); rect(78, 0, 99, MH - 1, T.CLIFF); rect(63, 0, 77, 0, T.CLIFF); rect(63, MH - 1, 77, MH - 1, T.CLIFF);
  // Rivière + mer
  rect(0, 45, 60, 46, T.WATER);
  rect(0, 55, 60, MH - 1, T.WATER);
  for (let x = 0; x <= 60; x++) { const h = hash(x, 99) % 3; if (h === 0) set(x, 54, T.WATER); }
  // Lisière forêt
  rect(0, 18, 60, 19, T.TREE);
  // Bords
  rect(0, 0, 60, 0, T.TREE); rect(0, 0, 0, 54, T.TREE);

  // ----- Chemins -----
  rect(2, 30, 60, 30, T.PATH);                       // grande route
  rect(9, 25, 9, 29, T.PATH);                        // maison
  rect(18, 28, 19, 29, T.PATH);                      // champ
  rect(22, 18, 23, 29, T.PATH);                      // vers la forêt
  rect(33, 27, 33, 29, T.PATH);                      // étang
  rect(14, 37, 20, 37, T.PATH); rect(20, 31, 20, 37, T.PATH); // enclos
  rect(30, 31, 31, 44, T.PATH);                      // vers le pont
  // Forêt
  rect(22, 8, 23, 17, T.PATH); rect(6, 8, 54, 8, T.PATH); rect(12, 3, 12, 8, T.PATH); rect(44, 8, 44, 15, T.PATH); rect(36, 15, 52, 15, T.PATH);
  // Plage
  rect(30, 47, 31, 53, T.PATH); rect(8, 52, 41, 52, T.PATH);
  // Village : place pavée
  rect(44, 27, 59, 35, T.STONE); rect(51, 25, 51, 26, T.STONE); rect(50, 36, 50, 37, T.STONE); rect(46, 36, 46, 40, T.STONE); rect(55, 36, 55, 41, T.STONE);
  rect(42, 30, 43, 30, T.STONE);
  rect(59, 30, 60, 31, T.STONE);
  // Montagne
  rect(61, 30, 62, 31, T.STONE); rect(63, 30, 71, 31, T.STONE); rect(70, 11, 71, 45, T.STONE); rect(64, 20, 76, 20, T.STONE); rect(64, 40, 76, 40, T.STONE); rect(68, 10, 71, 10, T.STONE); rect(72, 14, 76, 14, T.STONE);
  rect(42, 41, 60, 41, T.STONE); rect(22, 51, 26, 51, T.PATH);
  const MR = rng(77);
  for (let y = 3; y <= 44; y++) for (let x = 82; x <= 97; x++) if (MR() > .16) set(x, y, T.STONE);
  rect(89, 3, 90, 45, T.STONE);
  for (const yy of [8, 15, 22, 29, 36, 42]) rect(83, yy, 96, yy, T.STONE);
  rect(84, 3, 95, 5, T.STONE);

  // ----- Ferme -----
  for (let y = FIELD.y; y < FIELD.y + FIELD.h; y++) for (let x = FIELD.x; x < FIELD.x + FIELD.w; x++) set(x, y, T.PLOT);
  for (let x = FIELD.x - 1; x <= FIELD.x + FIELD.w; x++) { set(x, FIELD.y - 1, T.FENCE); if (x !== 18 && x !== 19) set(x, FIELD.y + FIELD.h, T.FENCE); }
  for (let y = FIELD.y - 1; y <= FIELD.y + FIELD.h; y++) { set(FIELD.x - 1, y, T.FENCE); set(FIELD.x + FIELD.w, y, T.FENCE); }
  for (let y = 0; y < MH; y++) for (let x = 26; x < 41; x++) {
    const d = ((x + .5 - 33.5) / 3.8) ** 2 + ((y + .5 - 24) / 2.3) ** 2;
    if (d < 1) set(x, y, T.WATER); else if (d < 1.6 && get(x, y) === T.GRASS) set(x, y, T.SAND);
  }
  for (let x = PEN.x; x < PEN.x + PEN.w; x++) { set(x, PEN.y, T.FENCE); set(x, PEN.y + PEN.h - 1, T.FENCE); }
  for (let y = PEN.y; y < PEN.y + PEN.h; y++) { set(PEN.x, y, T.FENCE); if (y !== 37 && y !== 38) set(PEN.x + PEN.w - 1, y, T.FENCE); }
  set(PEN.x + PEN.w - 1, 37, T.PATH);
  // Ponton
  rect(40, 53, 41, 58, T.PIER);
  // Plage : sable
  for (let y = 47; y <= 54; y++) for (let x = 1; x <= 60; x++) if (get(x, y) === T.GRASS) set(x, y, T.SAND);

  // Jardins de biome
  for (const g of Object.values(GARDENS)) for (let y = g.y; y < g.y + g.h; y++) for (let x = g.x; x < g.x + g.w; x++) set(x, y, T.PLOT);
  rect(32, 8, 38, 8, T.PATH);
  // ----- Zones réservées (pas de décor) -----
  const reserved = new Set();
  const reserve = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) reserved.add(x + ',' + y); };
  BUILDINGS.forEach(b => reserve(b.x - 1, b.y - 1, b.x + b.w, b.y + b.h + 1));
  reserve(FIELD.x - 2, FIELD.y - 2, FIELD.x + FIELD.w + 1, FIELD.y + FIELD.h + 2);
  reserve(PEN.x - 1, PEN.y - 1, PEN.x + PEN.w, PEN.y + PEN.h);
  reserve(42, 25, 61, 44); reserve(26, 20, 41, 28);
  for (const g of Object.values(GARDENS)) reserve(g.x - 1, g.y - 1, g.x + g.w, g.y + g.h + 1);
  reserve(37, 9, 44, 14); reserve(72, 21, 77, 28);
  for (const g of Object.values(GATES)) reserve(g.x - 2, g.y - 2, g.x + g.w + 1, g.y + g.h + 1);
  // distance au chemin
  const nearPath = (x, y, r) => { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const t = get(x + dx, y + dy); if (t === T.PATH || t === T.STONE || t === T.PIER || t === T.PLOT) return true; } return false; };

  const R = rng(2024);
  const decorable = t => t === T.GRASS || t === T.SAND;
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    const t = get(x, y), b = biomeAt(x, y);
    if (!decorable(t) || reserved.has(x + ',' + y)) continue;
    const v = R();
    if (b === 'foret') {
      if (!nearPath(x, y, 2)) { if (v < .42) set(x, y, T.TREE); else if (v < .48) set(x, y, T.BUSH); else if (v < .58) set(x, y, T.TALL); else if (v < .66) set(x, y, T.FLOWER); }
      else if (!nearPath(x, y, 1)) { if (v < .1) set(x, y, T.TALL); else if (v < .16) set(x, y, T.FLOWER); }
    } else if (b === 'montagne') {
      if (!nearPath(x, y, 2)) { if (v < .16) set(x, y, T.PINE); else if (v < .21) set(x, y, T.ROCK); }
    } else if (b === 'plage') {
      if (t === T.SAND && !nearPath(x, y, 1) && y < 53) { if (v < .05) set(x, y, T.PALM); }
    } else {
      if (nearPath(x, y, 1)) { if (v < .06) set(x, y, T.FLOWER); else if (v < .1) set(x, y, T.TALL); continue; }
      if (v < .07) set(x, y, T.TREE); else if (v < .09) set(x, y, T.BUSH); else if (v < .17) set(x, y, T.FLOWER); else if (v < .27) set(x, y, T.TALL);
    }
  }
  // Barrières : tuiles « fermées »
  for (const [id, g] of Object.entries(GATES)) for (let y = g.y; y < g.y + g.h; y++) for (let x = g.x; x < g.x + g.w; x++) set(x, y, id === 'pont' ? T.WATER : id === 'foret' ? T.PATH : T.STONE);

  // ----- Ressources -----
  const addNodes = (kind, n, test, seed) => {
    const r = rng(seed); let tries = 0, made = 0;
    while (made < n && tries++ < 5000) {
      const x = 2 + (r() * (MW - 4) | 0), y = 2 + (r() * (MH - 4) | 0);
      if (!test(x, y) || nodeGrid[y][x] || reserved.has(x + ',' + y)) continue;
      const near = NODES.some(o => Math.abs(o.x - x) + Math.abs(o.y - y) < 3);
      if (near) continue;
      const node = { id: NODES.length, kind, x, y };
      NODES.push(node); nodeGrid[y][x] = node; made++;
    }
  };
  const forestFree = (x, y) => biomeAt(x, y) === 'foret' && y >= 2 && y <= 16 && [T.GRASS, T.TALL, T.FLOWER].includes(get(x, y)) && nearPath(x, y, 2) && !nearPath(x, y, 0);
  addNodes('branche', 14, forestFree, 11);
  addNodes('champi', 12, forestFree, 12);
  addNodes('baie', 8, forestFree, 13);
  addNodes('coquillage', 12, (x, y) => biomeAt(x, y) === 'plage' && get(x, y) === T.SAND && y >= 49, 14);
  const mountFree = (x, y) => biomeAt(x, y) === 'montagne' && get(x, y) === T.GRASS && nearPath(x, y, 2) && !nearPath(x, y, 0) && y > 2 && y < 57;
  addNodes('iron', 6, mountFree, 16);
  addNodes('rock', 14, mountFree, 17);
  const mineFree = (x, y) => biomeAt(x, y) === 'mine' && get(x, y) === T.STONE && x !== 89 && x !== 90 && ![8, 15, 22, 29, 36, 42].includes(y) && y > 3 && y < 44;
  addNodes('crystal', 8, (x, y) => mineFree(x, y) && y < 30, 18);
  addNodes('gold', 6, (x, y) => mineFree(x, y) && y < 22, 19);
  addNodes('rubis', 4, (x, y) => mineFree(x, y) && y < 14, 22);
  addNodes('emeraude', 4, (x, y) => mineFree(x, y) && y < 14, 23);
  addNodes('iron', 12, mineFree, 20);
  addNodes('rock', 12, mineFree, 21);
}
buildMap();

    for (const w of LIGHTS) { if (!lightOn(w)) continue; ctx.fillStyle = `rgba(255,190,90,${dk})`; ctx.fillRect((w.x - camX) * sc, (w.y - camY) * sc, w.w * sc, w.h * sc); glow(w.x + w.w / 2, w.y + w.h / 2 + 6, w.lamp ? 30 : 26, `rgba(255,170,70,${dk * .35})`); }
    glow(P.x * TILE, P.y * TILE - 8, 40, `rgba(255,190,110,${dk * .25})`);
    if (!inMine()) for (const b of bugs) { const fl = (Math.sin(b.ph * 3) + 1) / 2; if (fl > .3) { ctx.fillStyle = `rgba(220,255,120,${fl * dk * 1.4})`; ctx.fillRect((b.x * TILE - camX) * sc, (b.y * TILE - camY) * sc, sc, sc); } }
    ctx.globalCompositeOperation = 'source-over';

}

function lockedZoneRects(g, s) {

let miniLocked = null, miniKey = '';
function drawMini() {

if (existing && S.started) {
  const away = (Date.now() - S.last) / 1000;
  if (away > 5) { catchUp(Math.min(away, 86400)); if (away > 60) setTimeout(() => toast(`👋 Ta ferme a poussé pendant ton absence (${fmt(Math.min(away, 86400))}).`), 500); }
  syncOrders(); if (!S.daily) S.daily = genDaily();
}
resize();
zoom = zoomTarget = S.zoom || (innerWidth < 700 ? .8 : innerWidth < 1100 ? 1 : 1.15);
showTitle();

let last = performance.now(), uiTimer = 0, smokeT = 0;
function frame(t) {
  const dt = Math.min(.1, (t - last) / 1000); last = t; now = t;
  zoom += (zoomTarget - zoom) * Math.min(1, dt * 12);
  if (S.started) simulate(dt);
  if (S.started) { autoStep(dt, false); updateWorkers(dt); }
  updatePlayer(dt); updateFishing(dt); updateAnimals(dt); updateNpcs(dt); updateCritters(dt); updateParts(dt);
  for (const id in nodeShake) { nodeShake[id] -= dt; if (nodeShake[id] <= 0) delete nodeShake[id]; }
  if (dlg.cur && dlg.shown < dlg.cur.text.length) { dlg.shown = Math.min(dlg.cur.text.length, dlg.shown + dt * 55); renderDialog(); }
  if (S.started && !busy()) { S.time += dt * 2; if (S.time >= 1440) { S.time -= 1440; newDay(); } }
  smokeT -= dt;
  if (smokeT <= 0) {
    smokeT = .35;
    emit(6 * 16 + 72, 21 * 16 - 16, 1, { col: '#e8e8e8', speed: 6, life: 2.2, grav: -6, kind: 'smoke', angle: -Math.PI / 2 - .3, spread: .4, jitter: 2 });
    for (const b of BUILDINGS) if (b.ws && wsBusy(S.workshops[b.ws])) emit(b.x * 16 + 39, b.y * 16 - 14, 1, { col: '#d8d8d8', speed: 6, life: 2, grav: -7, kind: 'smoke', angle: -Math.PI / 2 - .3, spread: .4, jitter: 2 });
    if (false) emit(0, 0, 1, { col: '#cfcfcf', speed: 7, life: 2, grav: -7, kind: 'smoke', angle: -Math.PI / 2 - .3, spread: .4, jitter: 2 });
  }
  for (const f of floaters) f.t += dt;
  while (floaters.length && floaters[0].t >= 1) floaters.shift();
  let target = null;
  if (!busy()) { if (mouseActive()) { const w = mouseWorld(); target = targetAtWorld(w.x, w.y); } if (!target) target = getTarget(); }
  canvas.style.cursor = target && target.viaMouse ? (target.far ? 'not-allowed' : target.fn ? 'pointer' : 'default') : 'default';
  draw(target);
  uiTimer += dt;
  if (uiTimer > .15 && !titleOpen) { uiTimer = 0; checkMissions(); if (S.started) checkAchievements(); renderHud(target); renderPanel(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(save, 3000);
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

</script>
